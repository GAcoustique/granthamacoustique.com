.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block;cursor:pointer}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;position:absolute;right:0;bottom:0;background:#fff;color:#111;padding:6px 10px}
.under{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;padding:16px var(--pad) 0}
.under .lines{max-width:62ch;flex:1 1 420px}.under .line{font-size:clamp(18px,1.8vw,24px);font-weight:300;margin:0;line-height:1.35}.under .line2{font-size:15px;color:var(--mute);margin:6px 0 0}
.nav{display:flex;gap:28px;font-size:15px}
.nav a:hover,.nav a:focus-visible{text-decoration:underline;text-underline-offset:4px}
.head{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:0 var(--pad);margin:28px 0 0}
/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:16px var(--pad) 40px}
.grid button{display:block;text-align:left;width:100%}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee;transition:opacity .2s}
.grid button:hover img,.grid button:focus-visible img{opacity:.82}
.grid span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;color:#333}
.more{margin:0 var(--pad);padding:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}.more a{border-bottom:1px solid #bbb}.more a:hover{border-color:#111}
/* text sections */
section.text{border-top:1px solid var(--line);margin:24px var(--pad) 0;padding:40px 0 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
section.text>:nth-child(2){grid-column:2/-1}
section.text h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:4px 0 0}
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 16px}
.svlead{max-width:62ch;font-weight:300;margin:0 0 28px;font-size:18px;line-height:1.5}
.services>div{padding-right:32px}
.services h3{font-size:18px;font-weight:500;margin:0 0 10px;line-height:1.3}
.services p{margin:0;font-weight:300;color:#222}
.contact p{margin:0 0 6px;font-weight:300;font-size:18px}
.contact a{border-bottom:1px solid #bbb}.contact a:hover{border-color:#111}
footer{padding:48px var(--pad) 32px;font-size:12px;color:var(--mute)}
/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;display:none}
.viewer.on{display:block}
.vbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px var(--pad);background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);z-index:1}
.vbar h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:0}
.vbar .ctl{display:flex;gap:6px;font-size:14px}
.vbar .ctl button{padding:8px 10px;min-height:40px}
.vbar .ctl button:hover{text-decoration:underline;text-underline-offset:4px}
.vbody{padding:24px var(--pad) 64px;max-width:1500px;margin:0 auto}
.vbody figure{margin:0 0 28px}
.vbody img{display:block;max-width:100%;max-height:86vh;margin:0 auto;background:#f2f2f2}
.vbody figcaption{text-align:center;font-size:12px;color:var(--mute);margin-top:6px}
.vmeta{border-top:1px solid var(--line);padding-top:20px;max-width:760px;margin:8px auto 0;font-weight:300}
.vmeta p{margin:0 0 6px}.vmeta .vsp{margin-top:16px}
.vmeta a{border-bottom:1px solid #bbb}
@media(max-width:900px){.services{grid-template-columns:1fr;gap:32px}.services>div{padding-right:0}section.text{grid-template-columns:1fr;gap:24px}section.text>:nth-child(2){grid-column:auto}}
@media(max-width:700px){.car{height:62svh;min-height:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header img{width:130px}.nav{gap:20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

tr.innerHTML=slides.map(([s,k])=>`<img src="img/${s}" alt="${esc(nm(P[byS[k]][1]))}" data-open="${k}">`).join("");
const CITY={treehouse:"Sainte-Adèle"};let ci=0;function go(i){ci=(i+slides.length)%slides.length;tr.scrollTo({left:tr.clientWidth*ci,behavior:"smooth"});cap.textContent=(nm(P[byS[slides[ci][1]]][1]).split(",")[0]+", "+(CITY[slides[ci][1]]||"Montréal")).toUpperCase()}
go(0);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let paused=false;car.addEventListener("pointerenter",()=>paused=true);car.addEventListener("pointerleave",()=>paused=false);
if(!reduce)setInterval(()=>{if(!paused&&cur<0&&!document.hidden)go(ci+1)},5500);
tr.addEventListener("scroll",()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==ci&&i>=0&&i<slides.length){ci=i;cap.textContent=(nm(P[byS[slides[ci][1]]][1]).split(",")[0]+", "+(CITY[slides[ci][1]]||"Montréal")).toUpperCase()}},{passive:true});
addEventListener("resize",()=>go(ci));
// viewer
const V=document.querySelector(".viewer"),VB=V.querySelector(".vbody");let cur=-1,lastFocus=null;
function open(i,keep){cur=(i+P.length)%P.length;const [s,n,,c,co,cr=[],pr=[],url=""]=P[cur],t=T[L];
 V.querySelector("#vtitle").textContent=nm(n);
 let h="";for(let k=1;k<=c;k++){const who=cr[k-1];h+=`<figure><img src="img/${s}-${k}.jpg" alt="${esc(nm(n))}, ${k}/${c}" ${k>2?'loading="lazy"':''}>${who?`<figcaption>${t.photo} : ${esc(who)}</figcaption>`:""}</figure>`}
 h+=`<div class="vmeta">`+co.map(([w,fr,en])=>`<p>${esc(w)} : ${L==="en"?en:fr}</p>`).join("")+(pr.length?`<p class="vsp">${t.press} : ${pr.map(([a,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(a)}</a>`).join(" · ")}</p>`:"")+(url?`<p class="vsp">${t.site} : <a href="${url}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))}</a></p>`:"")+`</div>`;
 if(L==="en")h=h.replace(/ : /g,": ");
 VB.innerHTML=h;
 if(!keep){V.scrollTop=0;if(!V.classList.contains("on")){lastFocus=document.activeElement;V.classList.add("on");document.body.style.overflow="hidden";history.pushState({v:1},"","#"+hashOf(s))}
  else history.replaceState({v:1},"","#"+hashOf(s));V.querySelector("[data-close]").focus({preventScroll:true})}}
function close(){if(history.state&&history.state.v){history.back();return}shut()}
addEventListener("popstate",()=>{if(cur>=0&&!(history.state&&history.state.v))shut(true)});
function shut(fromPop){V.classList.remove("on");document.body.style.overflow="";cur=-1;if(!fromPop)history.replaceState(null,"",location.pathname+location.search);if(lastFocus)lastFocus.focus({preventScroll:true})}
document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o){open(byS[o.dataset.open]);return}
 if(e.target.closest("[data-close]"))close();if(e.target.closest("[data-prev]"))open(cur-1);if(e.target.closest("[data-next]"))open(cur+1);
 const lb=e.target.closest(".lang button");if(lb)lang(lb.dataset.l)});
addEventListener("keydown",e=>{if(cur>=0){if(e.key==="Escape")close();if(e.key==="ArrowRight")open(cur+1);if(e.key==="ArrowLeft")open(cur-1);return}
 if(e.key==="ArrowRight")go(ci+1);if(e.key==="ArrowLeft")go(ci-1)});
lang(L);
let h=decodeURIComponent(location.hash.slice(1));if(h in byU)h=byU[h];if(h in byS){history.replaceState(null,"",location.pathname+location.search);open(byS[h])}
}
</script>
</body>
</html>
