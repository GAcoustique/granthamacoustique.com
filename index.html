<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grantham Acoustique — Salles pour le son et l'image</title>
<meta name="description" content="Grantham Acoustique, Montréal. Conception de salles pour le son et l'image, acoustique architecturale et insonorisation.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://granthamacoustique.com/">
<meta property="og:title" content="Grantham Acoustique — Salles pour le son et l'image">
<meta property="og:description" content="Grantham Acoustique, Montréal. Conception de salles pour le son et l'image, acoustique architecturale et insonorisation.">
<meta property="og:image" content="https://granthamacoustique.com/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* V0, built from style-round variant G (Nov 26, 2026). Black, white, greys; IBM Plex Sans; B&W photos. */
:root{--ink:#111;--mute:#6f6f6f;--line:#e6e6e6;--pad:max(3vw,16px)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:16px var(--pad)}
header img{width:150px;display:block}
.lang{font-size:13px;letter-spacing:.04em}
.lang button{padding:8px 4px;opacity:.45}.lang button[aria-pressed=true]{opacity:1}
/* carousel */
.car{position:relative;overflow:hidden;background:#000;height:min(calc(100svh - 290px - clamp(50px,6svh,110px)),calc((100vw - 6vw)/2.1));min-height:300px;margin:0 var(--pad)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block;cursor:pointer}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;position:absolute;right:0;bottom:0;background:#fff;color:#111;padding:6px 10px}
.under{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;padding:16px var(--pad) 0}
.under .lines{max-width:62ch;flex:1 1 420px}.under .line{font-size:clamp(18px,1.8vw,24px);font-weight:300;margin:0;line-height:1.35}.under .line2{font-size:15px;color:var(--mute);margin:6px 0 0}
.nav{display:flex;gap:28px;font-size:15px}
.nav a:hover,.nav a:focus-visible{text-decoration:underline;text-underline-offset:4px}
.head{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:0 var(--pad);margin:28px 0 0}
/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:16px var(--pad) 40px}
.grid button{display:block;text-align:left;width:100%}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee;transition:opacity .2s}
.grid button:hover img,.grid button:focus-visible img{opacity:.82}
.grid span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;color:#333}
/* text sections */
section.text{border-top:1px solid var(--line);margin:24px var(--pad) 0;padding:40px 0 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
section.text>:nth-child(2){grid-column:2/-1}
section.text h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:4px 0 0}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.services>div{padding-right:32px}
.services h3{font-size:18px;font-weight:500;margin:0 0 10px;line-height:1.3}
.services p{margin:0;font-weight:300;color:#222}
.contact p{margin:0 0 6px;font-weight:300;font-size:18px}
.contact a{border-bottom:1px solid #bbb}.contact a:hover{border-color:#111}
footer{padding:48px var(--pad) 32px;font-size:12px;color:var(--mute)}
/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:#fff;overflow-y:auto;display:none}
.viewer.on{display:block}
.vbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px var(--pad);background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);z-index:1}
.vbar h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:0}
.vbar .ctl{display:flex;gap:6px;font-size:14px}
.vbar .ctl button{padding:8px 10px;min-height:40px}
.vbar .ctl button:hover{text-decoration:underline;text-underline-offset:4px}
.vbody{padding:24px var(--pad) 64px;max-width:1500px;margin:0 auto}
.vbody figure{margin:0 0 28px}
.vbody img{display:block;max-width:100%;max-height:86vh;margin:0 auto;background:#f2f2f2}
.vbody figcaption{text-align:center;font-size:12px;color:var(--mute);margin-top:6px}
.vmeta{border-top:1px solid var(--line);padding-top:20px;max-width:760px;margin:8px auto 0;font-weight:300}
.vmeta p{margin:0 0 8px}
.vmeta a{border-bottom:1px solid #bbb}
@media(max-width:900px){.services{grid-template-columns:1fr;gap:32px}.services>div{padding-right:0}section.text{grid-template-columns:1fr;gap:24px}section.text>:nth-child(2){grid-column:auto}}
@media(max-width:700px){.car{height:62svh;min-height:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header img{width:130px}.nav{gap:20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
 <a href="#" aria-label="Grantham Acoustique"><img src="img/wordmark-noir.svg" alt="Grantham Acoustique"></a>
 <div class="lang" role="group" aria-label="Langue / Language"><button data-l="fr" aria-pressed="true">FR</button> | <button data-l="en" aria-pressed="false">EN</button></div>
</header>

<div class="car" data-car>
 <div class="track"></div>
 <span class="cap" data-cap></span>
</div>
<div class="under">
 <div class="lines"><p class="line" data-t="tagline"></p><p class="line2" data-t="tagline2"></p></div>
 <nav class="nav"><a href="#realisations" data-t="n1"></a><a href="#services" data-t="n2"></a><a href="#contact" data-t="n3"></a></nav>
</div>

<p class="head" id="realisations" data-t="n1"></p>
<div class="grid" data-grid></div>

<section class="text" id="services">
 <h2 data-t="n2"></h2>
 <div class="services">
  <div><h3 data-t="s1h"></h3><p data-t="s1"></p></div>
  <div><h3 data-t="s2h"></h3><p data-t="s2"></p></div>
  <div><h3 data-t="s3h"></h3><p data-t="s3"></p></div>
 </div>
</section>

<section class="text contact" id="contact">
 <h2 data-t="n3"></h2>
 <div>
  <p>Nicolas Grou</p>
  <p><a href="mailto:nicolas@granthamacoustique.com">nicolas@granthamacoustique.com</a></p>
  <p><a href="tel:+15146636425">514 663-6425</a></p>
  <p>Montréal</p>
 </div>
</section>

<footer>© 2026 Grantham Acoustique</footer>

<div class="viewer" role="dialog" aria-modal="true" aria-labelledby="vtitle">
 <div class="vbar">
  <h2 id="vtitle"></h2>
  <div class="ctl"><button data-prev data-t="prev"></button><button data-next data-t="next"></button><button data-close data-t="close"></button></div>
 </div>
 <div class="vbody"></div>
</div>

<script>
{
const T={
 fr:{tagline:"Grantham Acoustique conçoit des studios d’enregistrement, de mixage et de postproduction, pour le son et l’image.",tagline2:"Acoustique architecturale et insonorisation.",n1:"Réalisations",n2:"Services",n3:"Contact",
  s1h:"Salles pour le son et l’image",s1:"Studios, régies, mixage et mastering, postproduction, salles d’écoute. Salles Dolby Atmos et accompagnement pour la certification Feature Studio. Isolation, contrôle des modes et des premières réflexions, traitement à large bande.",
  s2h:"Acoustique architecturale",s2:"Conception acoustique au sein de l’équipe de professionnels : isolation entre usages, bruit des équipements, salles. Plans et détails, par phases, jusqu’au chantier.",
  s3h:"Insonorisation",s3:"Diagnostic, recommandations et plans d’isolation, en bâtiment neuf ou existant : murs, planchers, plafonds, portes, fenêtres, ventilation. Visites de chantier.",
  avec:"Avec",photo:"Photo",press:"Presse",prev:"←",next:"→",close:"Fermer ✕"},
 en:{tagline:"Grantham Acoustique designs recording, mixing and post-production studios, for sound and picture.",tagline2:"Architectural acoustics and soundproofing.",n1:"Projects",n2:"Services",n3:"Contact",
  s1h:"Rooms for sound and picture",s1:"Studios, control rooms, mixing and mastering, post-production, listening rooms. Dolby Atmos rooms and support for Feature Studio certification. Isolation, control of modes and early reflections, broadband treatment.",
  s2h:"Architectural acoustics",s2:"Acoustic design within the professional team: isolation between uses, equipment noise, rooms. Drawings and details, phase by phase, through to construction.",
  s3h:"Soundproofing",s3:"Diagnosis, recommendations and isolation drawings, for new or existing buildings: walls, floors, ceilings, doors, windows, ventilation. Site visits.",
  avec:"With",photo:"Photo",press:"Press",prev:"←",next:"→",close:"Close ✕"}};
const A="Antarès Rénovation", CM="Colin Munro Architecte";
// [slug, name, thumb, photo count, co-credits, per-photo credits, press]
const P=[
 ["outpost","Outpost, salle 5.1 et isoloir","p01",5,["Espace 313",A]],
 ["parade","Parade Studios","p04",7,["Ivy Studio"],["Alex Lesage","Alex Lesage","Alex Lesage","Alex Lesage","Alex Lesage","Alex Lesage","Alex Lesage"],[["ArchDaily, 2024","https://www.archdaily.com/1023962/parade-studios-ivy-studio"]]],
 ["circonflexe","Studio Circonflexe","p03",10,[CM,"Zébulon Perron",A],["Olivier Blouin","Olivier Blouin","Olivier Blouin","Olivier Blouin","David Boyer","David Boyer","David Boyer","Olivier Blouin","David Boyer","David Boyer"]],
 ["pierre-girard","Pierre Girard et Olivier Langevin","p11",3,["Simon de l’Étoile"]],
 ["outpost-suite","Outpost, salle Atmos Film","p24",3,["Espace 313",A]],
 ["cinema-moderne","Cinéma Moderne","p19",4,["Barin Architecture (aujourd’hui COEX)","Alexandre Domingue","Benjamin Rankin"],["","Peter Berra","Peter Berra","Peter Berra"],[["La Presse, 2018","https://www.lapresse.ca/cinema/nouvelles/201809/18/01-5196947-le-cinema-moderne-ouvre-ses-portes.php"],["Radio-Canada, 2018","https://ici.radio-canada.ca/article/info/1124447/cinema-moderne-montreal-mile-end-programmation-nouveau-films"],["La Presse, 2019","https://www.lapresse.ca/cinema/2019-09-17/le-cinema-moderne-a-un-an"]]],
 ["dandurand","Studio Dandurand","p08",13,[CM,A]],
 ["cult-nation","Cult Nation","p14",2,[A]],
 ["makina","Makina","p02",4,["Rose Architecture",A]],
 ["evil-eye","Studio Evil Eye","p05",4,[],["Behind Creation","Behind Creation","Behind Creation","Behind Creation"]],
 ["tone","Tone Studio","p07",3,[A],["James Duhamel","James Duhamel","James Duhamel"]],
 ["ian-kelly","Ian Kelly","p09",4,[]],
 ["lamajeure","Lamajeure, Studio F","p10",4,[A]],
 ["treehouse","Treehouse","p12",4,[]],
 ["la-shop","La Shop","p13",5,[A]],
 ["gamma","Gamma Recording","p15",4,["Pat Sayers"]],
 ["phi","Centre PHI, Habitat sonore","p16",3,["Phil Rochefort"]],
 ["fonetik","fo.ne.tik","p17",4,[A]],
 ["le-hublot","Studio Le Hublot","p18",4,[],["Julie Durocher","Julie Durocher","","Julie Durocher"]],
 ["pixel-audio","Pixel Audio","p20",3,[],["Raphaël Thibodeau","Raphaël Thibodeau",""]],
 ["beam","Le BEAM","p21",5,[],["","","","",""]],
 ["ryan-morey","Ryan Morey","p22",4,[],["","","",""]],
 ["lamajeure-d","Lamajeure, Studio D","p23",4,[]],
 ["codell","Codell Audio","p06",4,[A]]];
const slides=[["h1.jpg","outpost"],["h2.jpg","circonflexe"],["h3.jpg","outpost"],["h9.jpg","treehouse"],["h4.jpg","circonflexe"],["h7.jpg","cult-nation"],["h5.jpg","outpost"],["h8.jpg","gamma"]];
const byS=Object.fromEntries(P.map((p,i)=>[p[0],i]));
let L="fr";try{L=localStorage.getItem("ga-lang")||"fr"}catch(e){}
const qs=new URLSearchParams(location.search).get("lang");if(qs==="en"||qs==="fr")L=qs;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function lang(l){L=l;document.documentElement.lang=l;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[l][e.dataset.t]);
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
 try{localStorage.setItem("ga-lang",l)}catch(e){}
 if(cur>=0)open(cur,true);}
// grid
document.querySelector("[data-grid]").innerHTML=P.map(p=>`<button data-open="${p[0]}"><img src="img/${p[2]}.jpg" alt="${esc(p[1])}" loading="lazy"><span>${esc(p[1])}</span></button>`).join("");
// carousel
const car=document.querySelector("[data-car]"),tr=car.querySelector(".track"),cap=car.querySelector("[data-cap]");
tr.innerHTML=slides.map(([s,k])=>`<img src="img/${s}" alt="${esc(P[byS[k]][1])}" data-open="${k}">`).join("");
const CITY={treehouse:"Sainte-Adèle"};let ci=0;function go(i){ci=(i+slides.length)%slides.length;tr.scrollTo({left:tr.clientWidth*ci,behavior:"smooth"});cap.textContent=(P[byS[slides[ci][1]]][1].split(",")[0]+", "+(CITY[slides[ci][1]]||"Montréal")).toUpperCase()}
go(0);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let paused=false;car.addEventListener("pointerenter",()=>paused=true);car.addEventListener("pointerleave",()=>paused=false);
if(!reduce)setInterval(()=>{if(!paused&&cur<0&&!document.hidden)go(ci+1)},5500);
tr.addEventListener("scroll",()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==ci&&i>=0&&i<slides.length){ci=i;cap.textContent=(P[byS[slides[ci][1]]][1].split(",")[0]+", "+(CITY[slides[ci][1]]||"Montréal")).toUpperCase()}},{passive:true});
addEventListener("resize",()=>go(ci));
// viewer
const V=document.querySelector(".viewer"),VB=V.querySelector(".vbody");let cur=-1,lastFocus=null;
function open(i,keep){cur=(i+P.length)%P.length;const [s,n,,c,co,cr=[],pr=[]]=P[cur],t=T[L];
 V.querySelector("#vtitle").textContent=n;
 let h="";for(let k=1;k<=c;k++){const who=cr[k-1];h+=`<figure><img src="img/${s}-${k}.jpg" alt="${esc(n)}, ${k}/${c}" ${k>2?'loading="lazy"':''}>${who?`<figcaption>${t.photo} : ${esc(who)}</figcaption>`:""}</figure>`}
 if(co.length||pr.length)h+=`<div class="vmeta">`+(co.length?`<p>${t.avec} ${co.map(esc).join(" · ")}</p>`:"")+(pr.length?`<p>${t.press} : ${pr.map(([a,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(a)}</a>`).join(" · ")}</p>`:"")+`</div>`;
 if(L==="en")h=h.replace(/ : /g,": ");
 VB.innerHTML=h;
 if(!keep){V.scrollTop=0;if(!V.classList.contains("on")){lastFocus=document.activeElement;V.classList.add("on");document.body.style.overflow="hidden"}
  history.replaceState(null,"","#"+s);V.querySelector("[data-close]").focus({preventScroll:true})}}
function close(){V.classList.remove("on");document.body.style.overflow="";cur=-1;history.replaceState(null,"",location.pathname+location.search);if(lastFocus)lastFocus.focus({preventScroll:true})}
document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o){open(byS[o.dataset.open]);return}
 if(e.target.closest("[data-close]"))close();if(e.target.closest("[data-prev]"))open(cur-1);if(e.target.closest("[data-next]"))open(cur+1);
 const lb=e.target.closest(".lang button");if(lb)lang(lb.dataset.l)});
addEventListener("keydown",e=>{if(cur>=0){if(e.key==="Escape")close();if(e.key==="ArrowRight")open(cur+1);if(e.key==="ArrowLeft")open(cur-1);return}
 if(e.key==="ArrowRight")go(ci+1);if(e.key==="ArrowLeft")go(ci-1)});
lang(L);
const h=location.hash.slice(1);if(h in byS)open(byS[h]);
}
</script>
</body>
</html>
